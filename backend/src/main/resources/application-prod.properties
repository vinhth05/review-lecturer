# ==================== PROD LOGGING PROFILE ====================
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.example.ctu=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}
logging.level.org.springframework.data.redis=${LOGGING_LEVEL_REDIS:WARN}
spring.jpa.show-sql=false
server.error.include-stacktrace=never
app.seed.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
