# ==================== TEST DATABASE (H2) ====================
spring.datasource.url=jdbc:h2:mem:ctu_review;MODE=MSSQLServer;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== JPA TEST CONFIG ====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==================== FLYWAY TEST CONFIG ====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# ==================== LOGGING TEST CONFIG ====================
logging.level.root=WARN
logging.level.com.example.ctu=INFO
logging.level.org.springframework.security=WARN
app.seed.enabled=false
app.jwt.secret=test-only-jwt-secret-with-at-least-32-characters
app.jwt.expiration-minutes=15
app.jwt.refresh-token-expiration-days=7
app.review.secret-key=test-only-review-secret
